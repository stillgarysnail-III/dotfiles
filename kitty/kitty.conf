# BEGIN_KITTY_THEME
# Catpuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

font_family JetBrainsMono Nerd Font Mono Medium
bold_font 	 auto
italic_font	 auto
bold_italic_font auto

font_size 10

background_opacity 0.4

# shape: block, beam, underline
cursor_shape underline

# Cursor blink
cursor_blink_interval 0

# Cursor color
cursor #fab387
cursor_text_color #6c7086
